<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Sports Draft HUD</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Sci-Fi & Luxury Feel -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'neon-blue': '#00f3ff',
                        'neon-pink': '#ff003c',
                        'neon-purple': '#bc13fe',
                        'dark-bg': '#050510',
                        'glass-bg': 'rgba(15, 20, 40, 0.65)',
                        'glass-border': 'rgba(0, 243, 255, 0.15)',
                    },
                    fontFamily: {
                        'scifi': ['Orbitron', 'sans-serif'],
                        'body': ['Rajdhani', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050510;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.08), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(188, 19, 254, 0.08), transparent 30%);
            color: #e2e8f0;
            overflow-x: hidden;
            user-select: none;
        }

        .glass-panel {
            background: var(--tw-colors-glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--tw-colors-glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 243, 255, 0.6); }

        /* Item Cards */
        .item-card {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            height: 96px; /* Höhere Karten für Name + Bild */
        }
        .item-card::before {
            content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 100%);
            opacity: 0; transition: opacity 0.3s;
        }
        .item-card:hover:not(.disabled)::before { opacity: 1; }
        .item-card:hover:not(.disabled) {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            border-color: rgba(0, 243, 255, 0.8);
            z-index: 10;
        }
        
        .item-card.selected-ban {
            border-color: #ff003c;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.5);
            opacity: 0.9;
        }

        .item-card.banned {
            filter: grayscale(100%) opacity(0.25);
            pointer-events: none;
        }
        .item-card.banned::after {
            content: ''; position: absolute; top: 50%; left: -10%; right: -10%; height: 2px;
            background: #ff003c; transform: rotate(-35deg); box-shadow: 0 0 8px #ff003c;
        }

        .item-card.picked-p1 {
            border-color: #00f3ff;
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.2);
            background: rgba(0, 243, 255, 0.1);
            pointer-events: none;
            opacity: 0.5;
        }
        .item-card.picked-p2 {
            border-color: #bc13fe;
            box-shadow: inset 0 0 20px rgba(188, 19, 254, 0.2);
            background: rgba(188, 19, 254, 0.1);
            pointer-events: none;
            opacity: 0.5;
        }

        /* Super Troop Link Badge */
        .super-troop-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 6px;
            background: rgba(255, 165, 0, 0.2);
            color: #ffa500;
            padding: 1px 3px;
            border-radius: 2px;
            font-family: 'Orbitron', sans-serif;
            border: 1px solid rgba(255, 165, 0, 0.4);
        }

        /* Modals */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            z-index: 50; justify-content: center; align-items: center;
        }
    </style>
</head>
<body class="font-body h-screen flex flex-col antialiased">
    <!-- Header -->
    <header class="h-16 glass-panel border-b border-white/10 border-t-0 flex items-center justify-between px-6 z-20">
        <div class="flex items-center gap-3">
            <i class="ph-fill ph-hexagon text-neon-blue text-3xl drop-shadow-[0_0_8px_rgba(0,243,255,0.8)]"></i>
            <h1 class="font-scifi text-xl font-bold tracking-widest text-white uppercase mt-1">Nexus <span class="text-neon-blue">Draft</span></h1>
        </div>
        <div id="status-display" class="font-scifi text-sm tracking-[0.2em] text-gray-400 mt-1">
            CONNECTING...
        </div>
        <div class="flex gap-4">
            <button id="btn-show-join" class="text-xs px-4 py-1.5 bg-white/5 border border-white/20 rounded hover:bg-white/10 transition">CHANGE SLOT</button>
            <button id="btn-reset" class="text-xs px-4 py-1.5 border border-red-500/50 rounded text-red-400 hover:bg-red-500/10 transition">RESET ROOM</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex overflow-hidden relative">
        
        <!-- Player 1 Sidebar -->
        <aside id="sidebar-p1" class="w-64 glass-panel border-r border-white/5 p-5 flex flex-col gap-4 z-10 transition-all duration-300">
            <div class="text-center pb-4 border-b border-white/10">
                <h2 class="font-scifi text-xl text-neon-blue font-bold tracking-wider drop-shadow-[0_0_5px_rgba(0,243,255,0.5)]">PLAYER 1</h2>
                <div id="p1-status" class="text-[10px] text-gray-500 uppercase tracking-widest mt-1 font-bold">Waiting...</div>
            </div>
            
            <div class="flex-1 flex flex-col gap-3">
                <h3 class="text-xs text-gray-400 uppercase tracking-widest mb-1 flex items-center gap-2">
                    <i class="ph ph-sword text-neon-blue"></i> Loadout
                </h3>
                <div id="p1-picks" class="flex flex-col gap-3 overflow-y-auto max-h-[calc(100vh-280px)]"></div>
            </div>

            <div class="h-auto border-t border-white/10 pt-4">
                <h3 class="text-xs text-gray-400 uppercase tracking-widest mb-3 flex justify-between items-center">
                    <span class="flex items-center gap-2"><i class="ph ph-prohibit text-red-500"></i> Bans</span>
                    <span id="p1-ban-count" class="text-[10px] bg-red-500/20 px-2 py-0.5 rounded text-red-400">0/3</span>
                </h3>
                <div id="p1-bans" class="flex justify-between gap-2"></div>
            </div>
        </aside>

        <!-- Center Draft Board -->
        <section class="flex-1 flex flex-col h-full relative">
            
            <!-- Category Tabs -->
            <div class="h-16 bg-black/40 border-b border-white/5 flex justify-center items-center gap-2 sm:gap-6 z-10 px-4">
                <button class="tab-btn active text-neon-blue font-scifi font-bold tracking-widest uppercase border-b-2 border-neon-blue py-4 px-2 transition-all hover:text-neon-blue hover:brightness-125 text-xs sm:text-sm" data-target="heroes">Heroes (6)</button>
                <button class="tab-btn text-gray-500 hover:text-gray-300 font-scifi font-medium tracking-widest uppercase border-b-2 border-transparent py-4 px-2 transition-all text-xs sm:text-sm" data-target="troops">Troops (32)</button>
                <button class="tab-btn text-gray-500 hover:text-gray-300 font-scifi font-medium tracking-widest uppercase border-b-2 border-transparent py-4 px-2 transition-all text-xs sm:text-sm" data-target="supertroops">Super Troops (17)</button>
                <button class="tab-btn text-gray-500 hover:text-gray-300 font-scifi font-medium tracking-widest uppercase border-b-2 border-transparent py-4 px-2 transition-all text-xs sm:text-sm" data-target="spells">Spells (18)</button>
                <button class="tab-btn text-gray-500 hover:text-gray-300 font-scifi font-medium tracking-widest uppercase border-b-2 border-transparent py-4 px-2 transition-all text-xs sm:text-sm" data-target="equips">Equips (43)</button>
            </div>

            <!-- Context Bar -->
            <div class="h-14 glass-panel border-none flex items-center justify-center px-8 shadow-lg relative z-20">
                <div id="instruction-text" class="text-sm md:text-base font-scifi tracking-widest text-gray-300 uppercase text-center w-full">
                    INITIALIZING SYSTEM...
                </div>
                <button id="action-btn" class="hidden absolute right-6 font-scifi px-6 py-2 bg-red-500/10 border border-red-500 text-red-400 font-bold tracking-widest rounded hover:bg-red-500 hover:text-white transition-all shadow-[0_0_10px_rgba(255,0,60,0.2)]">
                    LOCK BANS
                </button>
            </div>

            <!-- Item Grids -->
            <div class="flex-1 overflow-y-auto p-6 lg:p-8 relative">
                <div id="grid-heroes" class="category-grid grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 gap-3 lg:gap-4"></div>
                <div id="grid-troops" class="category-grid grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 gap-3 lg:gap-4 hidden"></div>
                <div id="grid-supertroops" class="category-grid grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 gap-3 lg:gap-4 hidden"></div>
                <div id="grid-spells" class="category-grid grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 gap-3 lg:gap-4 hidden"></div>
                <div id="grid-equips" class="category-grid grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 gap-3 lg:gap-4 hidden"></div>
            </div>
        </section>

        <!-- Player 2 Sidebar -->
        <aside id="sidebar-p2" class="w-64 glass-panel border-l border-white/5 p-5 flex flex-col gap-4 z-10 transition-all duration-300">
            <div class="text-center pb-4 border-b border-white/10">
                <h2 class="font-scifi text-xl text-neon-purple font-bold tracking-wider drop-shadow-[0_0_5px_rgba(188,19,254,0.5)]">PLAYER 2</h2>
                <div id="p2-status" class="text-[10px] text-gray-500 uppercase tracking-widest mt-1 font-bold">Waiting...</div>
            </div>
            
            <div class="flex-1 flex flex-col gap-3">
                <h3 class="text-xs text-gray-400 uppercase tracking-widest mb-1 flex items-center gap-2">
                    <i class="ph ph-sword text-neon-purple"></i> Loadout
                </h3>
                <div id="p2-picks" class="flex flex-col gap-3 overflow-y-auto max-h-[calc(100vh-280px)]"></div>
            </div>

            <div class="h-auto border-t border-white/10 pt-4">
                <h3 class="text-xs text-gray-400 uppercase tracking-widest mb-3 flex justify-between items-center">
                    <span class="flex items-center gap-2"><i class="ph ph-prohibit text-red-500"></i> Bans</span>
                    <span id="p2-ban-count" class="text-[10px] bg-red-500/20 px-2 py-0.5 rounded text-red-400">0/3</span>
                </h3>
                <div id="p2-bans" class="flex justify-between gap-2"></div>
            </div>
        </aside>
    </main>

    <!-- Modal for Messages/Lobby -->
    <div id="modal-overlay" class="flex modal-overlay">
        <div class="glass-panel p-8 rounded-xl max-w-md w-full text-center border-t border-neon-blue">
            <h2 id="modal-title" class="font-scifi text-2xl font-bold text-white mb-4">ONLINE DRAFT LOBBY</h2>
            <p id="modal-desc" class="text-gray-400 mb-8 text-sm">Wähle deine Rolle oder teste frei.</p>
            
            <div id="modal-actions" class="flex flex-col gap-3">
                <button id="join-p1-btn" class="w-full py-3 bg-neon-blue/10 border border-neon-blue text-neon-blue font-scifi font-bold rounded hover:bg-neon-blue hover:text-black transition shadow-[0_0_15px_rgba(0,243,255,0.2)]">
                    JOIN AS PLAYER 1
                </button>
                <button id="join-p2-btn" class="w-full py-3 bg-neon-purple/10 border border-neon-purple text-neon-purple font-scifi font-bold rounded hover:bg-neon-purple hover:text-black transition shadow-[0_0_15px_rgba(188,19,254,0.2)]">
                    JOIN AS PLAYER 2
                </button>
                <button id="join-spec-btn" class="w-full py-2 border border-gray-600 text-gray-400 font-scifi rounded hover:bg-gray-800 transition mt-2">
                    FREIER TEST (BEIDE SEITEN)
                </button>
            </div>
            <div id="modal-error" class="text-red-500 text-xs mt-4 hidden font-bold tracking-widest">SLOT BEREITS BELEGT!</div>
        </div>
    </div>

    <script type="module">
        const generateItems = (prefix, count, namePrefix, cat) => {
            return Array.from({length: count}, (_, i) => ({
                id: `${prefix}${i+1}`,
                name: `${namePrefix} ${i+1}`,
                category: cat,
                short: `${prefix.toUpperCase()}${i+1}`,
                img: null
            }));
        };

        const SUPER_TROOPS_DATA = [
            { id: 'st1', name: 'Super Barbarian', category: 'supertroops', short: 'Super Barbarian', baseTroopId: 't1', img: 'Supertroops/super_barbarian.png' },
            { id: 'st2', name: 'Super Archer', category: 'supertroops', short: 'Super Archer', baseTroopId: 't2', img: 'Supertroops/super_archer.png' },
            { id: 'st3', name: 'Sneaky Goblin', category: 'supertroops', short: 'Sneaky Goblin', baseTroopId: 't4', img: 'Supertroops/sneaky_goblin.png' },
            { id: 'st4', name: 'Super Wall Breaker', category: 'supertroops', short: 'Super Wall Breaker', baseTroopId: 't5', img: 'Supertroops/super_wall_breaker.png' },
            { id: 'st5', name: 'Super Giant', category: 'supertroops', short: 'Super Giant', baseTroopId: 't3', img: 'Supertroops/super_giant.png' },
            { id: 'st6', name: 'Rocket Balloon', category: 'supertroops', short: 'Rocket Balloon', baseTroopId: 't6', img: 'Supertroops/rocket_balloon.png' },
            { id: 'st7', name: 'Super Wizard', category: 'supertroops', short: 'Super Wizard', baseTroopId: 't7', img: 'Supertroops/super_wizard.png' },
            { id: 'st8', name: 'Super Dragon', category: 'supertroops', short: 'Super Dragon', baseTroopId: 't8', img: 'Supertroops/super_dragon.png' },
            { id: 'st9', name: 'Inferno Dragon', category: 'supertroops', short: 'Inferno Dragon', baseTroopId: 't9', img: 'Supertroops/inferno_dragon.png' },
            { id: 'st10', name: 'Super Minion', category: 'supertroops', short: 'Super Minion', baseTroopId: 't10', img: 'Supertroops/super_minion.png' },
            { id: 'st11', name: 'Super Valkyrie', category: 'supertroops', short: 'Super Valkyrie', baseTroopId: 't11', img: 'Supertroops/super_valkyrie.png' },
            { id: 'st12', name: 'Super Witch', category: 'supertroops', short: 'Super Witch', baseTroopId: 't12', img: 'Supertroops/super_witch.png' },
            { id: 'st13', name: 'Ice Hound', category: 'supertroops', short: 'Ice Hound', baseTroopId: 't13', img: 'Supertroops/ice_hound.png' },
            { id: 'st14', name: 'Super Bowler', category: 'supertroops', short: 'Super Bowler', baseTroopId: 't14', img: 'Supertroops/super_bowler.png' },
            { id: 'st15', name: 'Super Miner', category: 'supertroops', short: 'Super Miner', baseTroopId: 't15', img: 'Supertroops/super_miner.png' },
            { id: 'st16', name: 'Super Yeti', category: 'supertroops', short: 'Super Yeti', baseTroopId: 't16', img: 'Supertroops/super_yeti.png' },
            { id: 'st17', name: 'Super Hog Rider', category: 'supertroops', short: 'Super Hog Rider', baseTroopId: 't17', img: 'Supertroops/super_hog_rider.png' }
        ];

        const GAME_DATA = [
            ...generateItems('h', 6, 'Hero', 'heroes'),
            ...generateItems('t', 32, 'Troop', 'troops'),
            ...SUPER_TROOPS_DATA,
            ...generateItems('s', 18, 'Spell', 'spells'),
            ...generateItems('e', 43, 'Equip', 'equips')
        ];

        const ITEM_MAP = GAME_DATA.reduce((acc, item) => { acc[item.id] = item; return acc; }, {});
        const PICK_SEQUENCE = ['player1', 'player2', 'player2', 'player1', 'player1', 'player2'];
        
        let serverState = null;
        let userRole = 'p1'; // Standardmäßig uneingeschränkt zum Testen
        let userId = 'user_' + Math.random().toString(36).substr(2, 9);
        let localTempBans = [];
        
        const channel = new BroadcastChannel('draft-sync-channel');

        channel.onmessage = (event) => {
            if (event.data) {
                serverState = event.data;
                render();
            }
        };

        function updateServer(updates) {
            serverState = { ...serverState, ...updates };
            localStorage.setItem('draft_state', JSON.stringify(serverState));
            channel.postMessage(serverState);
            render();
        }

        const UI = {
            modal: document.getElementById('modal-overlay'),
            modalError: document.getElementById('modal-error'),
            statusText: document.getElementById('status-display'),
            instructionText: document.getElementById('instruction-text'),
            actionBtn: document.getElementById('action-btn'),
            btnReset: document.getElementById('btn-reset'),
            btnShowJoin: document.getElementById('btn-show-join'),
            grids: {
                heroes: document.getElementById('grid-heroes'),
                troops: document.getElementById('grid-troops'),
                supertroops: document.getElementById('grid-supertroops'),
                spells: document.getElementById('grid-spells'),
                equips: document.getElementById('grid-equips')
            }
        };

        function init() {
            buildGrids();
            setupTabs();

            document.getElementById('join-p1-btn').addEventListener('click', () => joinAs('p1'));
            document.getElementById('join-p2-btn').addEventListener('click', () => joinAs('p2'));
            document.getElementById('join-spec-btn').addEventListener('click', () => joinAs('spec'));
            
            UI.btnReset.addEventListener('click', () => resetRoom());
            UI.btnShowJoin.addEventListener('click', () => {
                UI.modal.style.display = 'flex';
            });

            const savedState = localStorage.getItem('draft_state');
            if (savedState) {
                serverState = JSON.parse(savedState);
                render();
            } else {
                resetRoom();
            }
        }

        function resetRoom() {
            serverState = {
                phase: 'BANS', 
                p1Id: userId, p2Id: userId,
                p1Bans: [], p2Bans: [], globalBans: [],
                p1BansLocked: true, p2BansLocked: true,
                p1Picks: [], p2Picks: [],
                pickIndex: 0
            };
            localTempBans = [];
            userRole = 'p1';
            UI.modal.style.display = 'none';
            updateServer({});
        }

        function joinAs(role) {
            if(!serverState) return;
            userRole = role === 'spec' ? 'p1' : role; // Erlaubt flüssiges Testen ohne Blockade
            if (serverState.phase === 'WAITING') {
                serverState.phase = 'BANS';
            }
            UI.modal.style.display = 'none'; 
            updateServer({});
        }

        function handleItemClick(itemId) {
            if (!serverState) return;
            if (isItemDisabled(itemId)) return;

            if (serverState.phase === 'BANS') {
                const idx = localTempBans.indexOf(itemId);
                if (idx > -1) {
                    localTempBans.splice(idx, 1);
                } else if (localTempBans.length < 3) {
                    localTempBans.push(itemId);
                }
                render();
            }
            else if (serverState.phase === 'PICKS') {
                const updates = { pickIndex: serverState.pickIndex + 1 };
                if (serverState.pickIndex % 2 === 0) {
                    updates.p1Picks = [...serverState.p1Picks, itemId];
                } else {
                    updates.p2Picks = [...serverState.p2Picks, itemId];
                }

                if (updates.pickIndex >= PICK_SEQUENCE.length) {
                    updates.phase = 'SUMMARY';
                }
                updateServer(updates);
            }
        }

        function isItemDisabled(itemId) {
            const item = ITEM_MAP[itemId];
            if (!item) return false;

            if (serverState.globalBans.includes(itemId) || serverState.p1Picks.includes(itemId) || serverState.p2Picks.includes(itemId)) {
                return true;
            }

            if (item.baseTroopId) {
                const bId = item.baseTroopId;
                if (serverState.globalBans.includes(bId) || serverState.p1Picks.includes(bId) || serverState.p2Picks.includes(bId)) {
                    return true;
                }
            }

            const relatedSuper = SUPER_TROOPS_DATA.find(st => st.baseTroopId === itemId);
            if (relatedSuper) {
                const sId = relatedSuper.id;
                if (serverState.globalBans.includes(sId) || serverState.p1Picks.includes(sId) || serverState.p2Picks.includes(sId)) {
                    return true;
                }
            }

            return false;
        }

        function handleActionClick() {
            if (!serverState) return;

            if (serverState.phase === 'BANS' && localTempBans.length === 3) {
                const expandedBans = [...localTempBans];
                localTempBans.forEach(id => {
                    const itm = ITEM_MAP[id];
                    if (itm.baseTroopId && !expandedBans.includes(itm.baseTroopId)) {
                        expandedBans.push(itm.baseTroopId);
                    }
                    const relSuper = SUPER_TROOPS_DATA.find(st => st.baseTroopId === id);
                    if (relSuper && !expandedBans.includes(relSuper.id)) {
                        expandedBans.push(relSuper.id);
                    }
                });

                updateServer({
                    p1Bans: expandedBans,
                    p2Bans: expandedBans,
                    globalBans: expandedBans,
                    phase: 'REVEAL',
                    p1BansLocked: true,
                    p2BansLocked: true
                });
            }
            else if (serverState.phase === 'REVEAL') {
                updateServer({ phase: 'PICKS', pickIndex: 0 });
            }
        }

        function render() {
            if(!serverState) return;

            UI.statusText.textContent = `MODE: TEST | PHASE: ${serverState.phase}`;

            document.querySelectorAll('.item-card').forEach(card => {
                const id = card.dataset.id;
                const item = ITEM_MAP[id];
                card.className = 'item-card relative bg-white/5 border border-white/10 rounded flex flex-col items-center justify-between p-1.5 select-none';
                
                let contentHTML = `<span class="text-[10px] font-scifi text-center text-gray-200 truncate w-full px-1">${item.name}</span>`;
                
                if (item.img) {
                    contentHTML += `<div class="flex-1 flex items-center justify-center my-0.5"><img src="${item.img}" alt="${item.name}" class="h-10 w-10 object-contain" onerror="this.onerror=null; this.replaceWith(Object.assign(document.createElement('span'), {textContent: '${item.short}', className: 'text-xs font-bold text-gray-400'}));"></div>`;
                } else {
                    contentHTML += `<div class="flex-1 flex items-center justify-center my-0.5"><span class="text-xs font-bold text-gray-400">${item.short}</span></div>`;
                }
                
                card.innerHTML = contentHTML;

                if (item.baseTroopId) {
                    const badge = document.createElement('span');
                    badge.className = 'super-troop-badge';
                    badge.textContent = 'SUPER';
                    card.appendChild(badge);
                }

                if (serverState.phase === 'BANS') {
                    if (localTempBans.includes(id)) {
                        card.classList.add('selected-ban');
                    }
                } 
                else if (serverState.phase === 'REVEAL' || serverState.phase === 'PICKS' || serverState.phase === 'SUMMARY') {
                    if (isItemDisabled(id)) {
                        card.classList.add('banned');
                    }
                    if (serverState.p1Picks.includes(id)) card.classList.add('picked-p1');
                    if (serverState.p2Picks.includes(id)) card.classList.add('picked-p2');
                }
            });

            updateSidebar('player1');
            updateSidebar('player2');

            UI.actionBtn.classList.add('hidden');
            UI.actionBtn.onclick = handleActionClick;

            if (serverState.phase === 'BANS') {
                UI.instructionText.innerHTML = `Wähle 3 Bans (<span class="text-neon-blue">${localTempBans.length}/3</span>)`;
                if (localTempBans.length === 3) {
                    UI.actionBtn.classList.remove('hidden');
                    UI.actionBtn.textContent = 'LOCK BANS';
                }
            }
            else if (serverState.phase === 'REVEAL') {
                UI.instructionText.innerHTML = "BANS GESPERRT. BEREIT FÜR PICKS.";
                UI.actionBtn.classList.remove('hidden');
                UI.actionBtn.textContent = 'STARTE PICKS';
            }
            else if (serverState.phase === 'PICKS') {
                const isP1Turn = serverState.pickIndex % 2 === 0;
                const pName = isP1Turn ? 'Player 1' : 'Player 2';
                const color = isP1Turn ? 'text-neon-blue' : 'text-neon-purple';
                UI.instructionText.innerHTML = `<span class="${color}">${pName} WÄHLT...</span> (Pick ${serverState.pickIndex + 1} / 6)`;
            }
            else if (serverState.phase === 'SUMMARY') {
                UI.instructionText.innerHTML = "DRAFT ABGESCHLOSSEN!";
            }
        }

        function updateSidebar(playerSlot) {
            const isP1 = playerSlot === 'player1';
            const colorClass = isP1 ? 'text-neon-blue' : 'text-neon-purple';
            const borderClass = isP1 ? 'border-neon-blue/30' : 'border-neon-purple/30';
            const statusEl = document.getElementById(`${isP1 ? 'p1' : 'p2'}-status`);
            
            statusEl.textContent = 'Active (Test)';
            
            const banContainer = document.getElementById(`${isP1 ? 'p1' : 'p2'}-bans`);
            const countEl = document.getElementById(`${isP1 ? 'p1' : 'p2'}-ban-count`);
            banContainer.innerHTML = '';
            
            let banList = [];
            let displayCount = 0;
            
            if (serverState.phase === 'BANS') {
                banList = localTempBans;
                displayCount = localTempBans.length;
            } else {
                banList = (isP1 ? serverState.p1Bans : serverState.p2Bans).filter(bId => !ITEM_MAP[bId].baseTroopId).slice(0, 3);
                displayCount = banList.length;
            }

            countEl.textContent = `${displayCount}/3`;

            for(let i=0; i<3; i++) {
                const box = document.createElement('div');
                box.className = 'w-10 h-10 bg-black/50 border border-white/10 rounded flex items-center justify-center text-[10px] font-bold font-scifi text-red-500 truncate p-0.5';
                if (banList[i]) {
                    const item = ITEM_MAP[banList[i]];
                    box.textContent = item ? item.name : '';
                    box.title = item ? item.name : '';
                    box.classList.add('border-red-500/50', 'bg-red-500/10');
                }
                banContainer.appendChild(box);
            }

            const pickContainer = document.getElementById(`${isP1 ? 'p1' : 'p2'}-picks`);
            pickContainer.innerHTML = '';
            const picks = isP1 ? serverState.p1Picks : serverState.p2Picks;
            
            for(let i=0; i<3; i++) {
                const box = document.createElement('div');
                box.className = `h-12 bg-black/50 border ${borderClass} rounded flex items-center justify-center text-xs font-bold font-scifi ${colorClass} px-1 text-center truncate`;
                if (picks[i]) {
                    const item = ITEM_MAP[picks[i]];
                    box.textContent = item.name;
                    box.classList.add(isP1 ? 'bg-neon-blue/10' : 'bg-neon-purple/10');
                } else {
                    box.classList.add('opacity-30');
                    box.textContent = '---';
                }
                pickContainer.appendChild(box);
            }
        }

        function buildGrids() {
            GAME_DATA.forEach(item => {
                const el = document.createElement('div');
                el.className = 'item-card relative bg-white/5 border border-white/10 rounded flex flex-col items-center justify-between p-1.5 select-none';
                el.dataset.id = item.id;
                el.title = item.name;
                
                let contentHTML = `<span class="text-[10px] font-scifi text-center text-gray-200 truncate w-full px-1">${item.name}</span>`;
                
                if (item.img) {
                    contentHTML += `<div class="flex-1 flex items-center justify-center my-0.5"><img src="${item.img}" alt="${item.name}" class="h-10 w-10 object-contain" onerror="this.onerror=null; this.replaceWith(Object.assign(document.createElement('span'), {textContent: '${item.short}', className: 'text-xs font-bold text-gray-400'}));"></div>`;
                } else {
                    contentHTML += `<div class="flex-1 flex items-center justify-center my-0.5"><span class="text-xs font-bold text-gray-400">${item.short}</span></div>`;
                }
                
                el.innerHTML = contentHTML;
                
                if (item.baseTroopId) {
                    const badge = document.createElement('span');
                    badge.className = 'super-troop-badge';
                    badge.textContent = 'SUPER';
                    el.appendChild(badge);
                }
                
                el.addEventListener('click', () => handleItemClick(item.id));
                UI.grids[item.category].appendChild(el);
            });
        }

        function setupTabs() {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => {
                tab.addEventListener('click', (e) => {
                    tabs.forEach(t => {
                        t.classList.remove('active', 'text-neon-blue', 'border-b-2', 'border-neon-blue', 'font-bold');
                        t.classList.add('text-gray-400');
                    });
                    
                    const target = e.target;
                    target.classList.remove('text-gray-400');
                    target.classList.add('active', 'text-neon-blue', 'border-b-2', 'border-neon-blue', 'font-bold');
                    
                    Object.values(UI.grids).forEach(g => g.classList.add('hidden'));
                    UI.grids[target.dataset.target].classList.remove('hidden');
                });
            });
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
